name: Build Windows App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build jar
        run: mvn -U clean package

      - name: Copy dependencies
        run: mvn dependency:copy-dependencies -DincludeScope=runtime -DoutputDirectory=target\\deps

      - name: Prepare input
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path target\app-input | Out-Null
          Copy-Item target\RandList-*.jar target\app-input\
          Copy-Item target\deps\*.jar target\app-input\

      - name: Package app image
        shell: pwsh
        run: |
          $mainJar = (Get-ChildItem target\app-input\RandList-*.jar | Select-Object -First 1).Name
          jpackage `
            --type app-image `
            --name RandList `
            --input target\app-input `
            --main-jar $mainJar `
            --main-class com.xinyang.randlist.Launcher `
            --java-options "--add-modules=javafx.controls,javafx.fxml" `
            --icon src\main\resources\appIcon.ico

      - name: Zip app image
        shell: pwsh
        run: |
          Compress-Archive -Path RandList\* -DestinationPath RandList_Windows.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RandList
          path: RandList_Windows.zip