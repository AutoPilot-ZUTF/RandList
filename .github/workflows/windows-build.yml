name: Build Windows App

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build jar
        run: mvn -U clean package

      - name: Copy dependencies
        run: mvn dependency:copy-dependencies -DincludeScope=runtime -DoutputDirectory=target\\deps

      - name: Prepare input
        run: |
          mkdir target\\app-input
          copy target\\RandList-1.0-SNAPSHOT.jar target\\app-input\\
          copy target\\deps\\*.jar target\\app-input\\

      - name: Package exe
        run: |
          jpackage ^
            --type app-image ^
            --name RandList ^
            --input target\\app-input ^
            --main-jar RandList-1.0-SNAPSHOT.jar ^
            --main-class com.xinyang.randlist.Launcher ^
            --icon src\\main\\resources\\appIcon.ico

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RandList-windows
          path: RandList
